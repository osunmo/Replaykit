services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: replaykit
      POSTGRES_PASSWORD: replaykit-local
      POSTGRES_DB: replaykit
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U replaykit -d replaykit']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - replaykit-dev-data:/var/lib/postgresql/data
volumes:
  replaykit-dev-data:
